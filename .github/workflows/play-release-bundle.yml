name: Build Play release bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    name: Signed Google Play AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Validate signing secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          FORGETTY_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          FORGETTY_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          FORGETTY_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          test -n "$FORGETTY_UPLOAD_STORE_PASSWORD"
          test -n "$FORGETTY_UPLOAD_KEY_ALIAS"
          test -n "$FORGETTY_UPLOAD_KEY_PASSWORD"

      - name: Restore upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/forgetty-upload.jks"
          test -s "$RUNNER_TEMP/forgetty-upload.jks"

      - name: Build signed optimized bundle
        env:
          FORGETTY_UPLOAD_STORE_FILE: ${{ runner.temp }}/forgetty-upload.jks
          FORGETTY_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          FORGETTY_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          FORGETTY_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean bundleRelease --console=plain

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: forgetty-play-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
